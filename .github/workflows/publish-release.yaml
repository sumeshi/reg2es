name: publish-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          pip install uv
          uv sync

      - name: Validate release version
        id: release_version
        run: |
          version=$(grep '__version__' src/reg2es/__about__.py | awk -F '"' '{print $2}')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
        shell: bash

      - name: Run tests
        run: uv run pytest

      - name: run python
        run: |
          uv run reg2es -h
          uv run reg2json -h
      
      - name: build
        run: |
          uv run --with nuitka python -m nuitka --standalone --onefile --follow-imports --include-distribution-metadata=reg2es --enable-plugin=multiprocessing --no-deployment-flag=self-execution -o reg2es.exe --output-dir=dist --assume-yes-for-downloads src/reg2es/views/Reg2esView.py
          uv run --with nuitka python -m nuitka --standalone --onefile --follow-imports --include-distribution-metadata=reg2es --enable-plugin=multiprocessing --no-deployment-flag=self-execution -o reg2json.exe --output-dir=dist --assume-yes-for-downloads src/reg2es/views/Reg2jsonView.py
      
      - name: verify
        run: |
          dist/reg2es.exe --version
          dist/reg2json.exe --version
      
      - name: rename asset
        run: |
          bundle="dist/reg2es-windows-x64-v${{ steps.release_version.outputs.version }}"
          mkdir -p "$bundle/licenses"
          mv dist/reg2es.exe "$bundle/"
          mv dist/reg2json.exe "$bundle/"
          uv run python .github/collect_runtime_licenses.py "$bundle/licenses"
          python -c "import shutil; shutil.make_archive(r'$bundle', 'zip', root_dir=r'$bundle')"
        shell: bash

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          files: |
            dist/reg2es-windows-x64-v${{ steps.release_version.outputs.version }}.zip
          name: Release v${{ steps.release_version.outputs.version }}
          body: 'This release was automatically created by GitHub Actions.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: build-windows
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.13']
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          sudo apt install patchelf
          pip install uv
          uv sync

      - name: Run tests
        run: uv run pytest

      - name: run python
        run: |
          uv run reg2es -h
          uv run reg2json -h

      - name: build
        run: |
          uv run --with nuitka python -m nuitka --standalone --onefile --follow-imports --include-distribution-metadata=reg2es --enable-plugin=multiprocessing --no-deployment-flag=self-execution -o reg2es --output-dir=dist --assume-yes-for-downloads src/reg2es/views/Reg2esView.py
          uv run --with nuitka python -m nuitka --standalone --onefile --follow-imports --include-distribution-metadata=reg2es --enable-plugin=multiprocessing --no-deployment-flag=self-execution -o reg2json --output-dir=dist --assume-yes-for-downloads src/reg2es/views/Reg2jsonView.py
      
      - name: verify
        run: |
          dist/reg2es --version
          dist/reg2json --version

      - name: rename asset
        run: |
          bundle="dist/reg2es-linux-x64-v${{ needs.build-windows.outputs.version }}"
          mkdir -p "$bundle/licenses"
          mv dist/reg2es "$bundle/"
          mv dist/reg2json "$bundle/"
          uv run python .github/collect_runtime_licenses.py "$bundle/licenses"
          python -c "import shutil; shutil.make_archive(r'$bundle', 'zip', root_dir=r'$bundle')"
        shell: bash

      - name: upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-windows.outputs.version }}
          files: |
            dist/reg2es-linux-x64-v${{ needs.build-windows.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
