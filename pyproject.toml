[project]
name = "reg2es"
dynamic = ["version"]
description = "A fast library for parsing and importing Windows NT Registry(REGF) into Elasticsearch."
readme = "README.md"
license = "MIT"
authors = [
    { name = "sumeshi", email = "j15322sn@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["registry", "elasticsearch", "json"]

dependencies = [
    "elasticsearch>=9.5.1",
    "orjson>=3.13.0",
    "python-registry>=1.3.1",
    "tqdm>=4.70.1",
    "urllib3>=2.8.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/reg2es/__about__.py"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "nuitka==4.3",
    "pytest>=9.1.1",
]

[project.scripts]
reg2es = "reg2es.views.Reg2esView:entry_point"
reg2json = "reg2es.views.Reg2jsonView:entry_point"

[tool.hatch.build.targets.wheel.force-include]
"LICENSES/Apache-2.0.txt" = "reg2es/LICENSES/Apache-2.0.txt"
